<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão de Estoque — Aviamento</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1320;
            color: #e2e8f0;
        }
        .card-dark {
            background-color: #111c2e;
            border: 1px solid #1e2d42;
        }
        .table-header {
            color: #38bdf8;
            border-bottom: 1px solid #1e2d42;
        }
        .filter-btn {
            background-color: #1e2d4a;
            color: #94a3b8;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: #0284c7;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-8">

    <!-- Header -->
    <header class="max-w-7xl w-full mx-auto flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
        <div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center gap-3">
                Painel de Gestão de Estoque — Aviamento
                <span class="text-xs font-normal text-slate-400 bg-slate-800/80 px-2.5 py-1 rounded-md border border-slate-700">Agosto 2026</span>
            </h1>
        </div>
        <div class="flex items-center gap-2">
            <a href="index.html" class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-800/60 text-slate-300 border border-slate-700 hover:bg-slate-700 transition">Visão Geral</a>
            <a href="estoque.html" class="px-4 py-2 text-xs font-semibold rounded-lg bg-sky-600 text-white border border-sky-500 shadow-lg shadow-sky-900/30">Tabela de Produtos</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl w-full mx-auto space-y-6">

        <!-- Área de Filtros -->
        <section class="card-dark p-5 rounded-xl space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-sm font-bold uppercase tracking-wider text-sky-400 flex items-center gap-2">
                        <i class="fa-solid fa-filter text-xs"></i> Filtrar por
                    </h2>
                    <p class="text-xs text-slate-400 mt-0.5">Selecione uma opção rápida para refinar a exibição da tabela</p>
                </div>

                <!-- Campo de Busca Digitando -->
                <div class="relative w-full md:w-80">
                    <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Buscar por descrição ou fornecedor..." 
                           class="w-full bg-slate-900/80 text-xs text-slate-200 placeholder-slate-500 rounded-lg border border-slate-700 pl-9 pr-4 py-2.5 focus:outline-none focus:border-sky-500 transition">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
                </div>
            </div>

            <!-- Botões de Filtros (Grupo, Marca, Estoque Baixo, Estoque Alto) -->
            <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-800/80">
                <button onclick="setFilter('all')" id="btn-all" class="filter-btn active text-xs font-medium px-3 py-1.5 rounded-lg">
                    Todos os Produtos
                </button>
                <div class="h-5 w-px bg-slate-800 my-auto mx-1"></div>
                
                <select id="selectGroup" onchange="applyFilters()" class="bg-slate-900/90 text-xs text-slate-300 border border-slate-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-sky-500">
                    <option value="">Grupo (Todos)</option>
                </select>

                <select id="selectBrand" onchange="applyFilters()" class="bg-slate-900/90 text-xs text-slate-300 border border-slate-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-sky-500">
                    <option value="">Marca / Fornecedor (Todas)</option>
                </select>

                <div class="h-5 w-px bg-slate-800 my-auto mx-1"></div>

                <button onclick="setFilter('low')" id="btn-low" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span> Estoque Baixo (&le; 15)
                </button>
                <button onclick="setFilter('high')" id="btn-high" class="filter-btn text-xs font-medium px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Estoque Alto (&gt; 15)
                </button>
            </div>
        </section>

        <!-- Tabela de Produtos -->
        <section class="card-dark rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-900/80 uppercase text-xs font-semibold tracking-wider table-header">
                        <tr>
                            <th scope="col" class="py-3.5 px-4">Descrição</th>
                            <th scope="col" class="py-3.5 px-4">Grupo</th>
                            <th scope="col" class="py-3.5 px-4">Marca / Fornecedor</th>
                            <th scope="col" class="py-3.5 px-4 text-center">Estoque</th>
                            <th scope="col" class="py-3.5 px-4 text-center">Curva ABC</th>
                            <th scope="col" class="py-3.5 px-4">Último Receb.</th>
                            <th scope="col" class="py-3.5 px-4">Dias de Venda</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-slate-800/60 font-normal">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <div class="p-3 bg-slate-900/50 border-t border-slate-800 text-xs text-slate-400 flex justify-between items-center">
                <span>Exibindo <strong id="visibleCount" class="text-sky-400">0</strong> de <strong id="totalCount" class="text-slate-200">0</strong> itens cadastrados</span>
            </div>
        </section>

    </main>

    <!-- Script de Gestão dos Dados -->
    <script>

            // Artesanato e Decoração
            { desc: "Miçanga redonda 4 mm", group: "Artesanato", brand: "Riviera", stock: 1500, abc: "Classe A", date: "26/08/2026", days: "90 dias" },
            { desc: "Pérola artificial 8 mm", group: "Artesanato", brand: "Elite", stock: 400, abc: "Classe A", date: "21/08/2026", days: "45 dias" },
            { desc: "Strass adesivo 5 mm", group: "Artesanato", brand: "Riviera", stock: 30, abc: "Classe B", date: "05/08/2026", days: "8 dias" },

            // Crochê e Tricô
            { desc: "Agulha de crochê 2,0 mm", group: "Crochê/Tricô", brand: "Riviera", stock: 55, abc: "Classe B", date: "14/08/2026", days: "15 dias" },
            { desc: "Agulha de tricô 4,5 mm", group: "Crochê/Tricô", brand: "Carmany", stock: 22, abc: "Classe B", date: "19/08/2026", days: "7 dias" },

            // Aviamentos para Roupas
            { desc: "Entretela termocolante 1 m", group: "Aviamento Roupas", brand: "Riviera", stock: 60, abc: "Classe A", date: "22/08/2026", days: "18 dias" },
            { desc: "Manta acrílica 1 m", group: "Aviamento Roupas", brand: "Elite", stock: 45, abc: "Classe A", date: "15/08/2026", days: "12 dias" },

            // Colas e Auxiliares
            { desc: "Cola para tecido 35 g", group: "Cola", brand: "Riviera", stock: 85, abc: "Classe A", date: "20/08/2026", days: "22 dias" },
            { desc: "Cola quente 7 mm (10 un)", group: "Cola", brand: "Elite", stock: 120, abc: "Classe B", date: "24/08/2026", days: "30 dias" },

            // Materiais de apoio
            { desc: "Caixa organizadora 500 ml", group: "Apoio", brand: "Riviera", stock: 40, abc: "Classe C", date: "10/08/2026", days: "15 dias" },
            { desc: "Expositor de aviamentos 50 cm", group: "Apoio", brand: "Riviera", stock: 3, abc: "Classe C", date: "02/08/2026", days: "1 dia (🔴 Crítico)" }
        ];

        let currentStockFilter = 'all';

        document.addEventListener("DOMContentLoaded", () => {
            populateSelectOptions();
            applyFilters();
        });

        function populateSelectOptions() {
            const groups = [...new Set(rawCatalog.map(item => item.group))].sort();
            const brands = [...new Set(rawCatalog.map(item => item.brand))].sort();

            const selectGroup = document.getElementById("selectGroup");
            groups.forEach(g => {
                const opt = document.createElement("option");
                opt.value = g;
                opt.textContent = g;
                selectGroup.appendChild(opt);
            });

            const selectBrand = document.getElementById("selectBrand");
            brands.forEach(b => {
                const opt = document.createElement("option");
                opt.value = b;
                opt.textContent = b;
                selectBrand.appendChild(opt);
            });
        }

        function setFilter(type) {
            currentStockFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${type}`).classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const searchVal = document.getElementById("searchInput").value.toLowerCase();
            const selectedGroup = document.getElementById("selectGroup").value;
            const selectedBrand = document.getElementById("selectBrand").value;

            const filtered = rawCatalog.filter(item => {
                const matchSearch = item.desc.toLowerCase().includes(searchVal) || item.brand.toLowerCase().includes(searchVal);
                const matchGroup = selectedGroup === "" || item.group === selectedGroup;
                const matchBrand = selectedBrand === "" || item.brand === selectedBrand;
                
                let matchStock = true;
                if (currentStockFilter === 'low') matchStock = item.stock <= 15;
                if (currentStockFilter === 'high') matchStock = item.stock > 15;

                return matchSearch && matchGroup && matchBrand && matchStock;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById("productTableBody");
            tbody.innerHTML = "";

            data.forEach(item => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/40 transition-colors border-b border-slate-800/60";

                let stockBadgeClass = "border-slate-700 text-slate-300";
                if (item.stock === 0) stockBadgeClass = "border-rose-500/50 text-rose-400 bg-rose-500/10";
                else if (item.stock <= 15) stockBadgeClass = "border-amber-500/50 text-amber-400 bg-amber-500/10";

                tr.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-slate-100">${item.desc}</td>
                    <td class="py-3 px-4 text-slate-400">${item.group}</td>
                    <td class="py-3 px-4 text-slate-300">${item.brand}</td>
                    <td class="py-3 px-4 text-center">
                        <span class="inline-block px-2.5 py-0.5 rounded-full border text-xs font-semibold ${stockBadgeClass}">
                            ${item.stock}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <span class="px-2 py-0.5 rounded border border-sky-500/30 text-sky-400 text-3xs font-medium">
                            ${item.abc}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-slate-400">${item.date}</td>
                    <td class="py-3 px-4 text-slate-300 font-medium">${item.days}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("visibleCount").textContent = data.length;
            document.getElementById("totalCount").textContent = rawCatalog.length;
        }
    </script>
</body>
</html>
